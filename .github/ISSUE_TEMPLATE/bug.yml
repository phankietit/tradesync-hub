name: Bug report
description: Something is broken in TradeSync
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. We read every issue and reply in this thread when a fix ships.
        Please avoid sharing passwords or account secrets.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence — what went wrong?
      placeholder: "Share link shows blank page after login"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Dashboard
        2. Click Share
        3. Open the link in incognito
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser / device
      options:
        - Chrome (desktop)
        - Firefox (desktop)
        - Safari (desktop)
        - Safari (iOS)
        - Chrome (Android)
        - Other
    validations:
      required: true

  - type: input
    id: account_context
    attributes:
      label: Account context (optional)
      description: e.g. Free tier, paper account — no email or password
      placeholder: "Free tier, 2 trading accounts"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag images into the comment box after submitting, or paste links here
    validations:
      required: false
