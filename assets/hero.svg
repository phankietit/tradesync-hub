      <stop offset="0.48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#02040b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 92) rotate(34) scale(420 245)">
      <stop stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
