    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 410) rotate(154) scale(420 250)">
      <stop stop-color="#34d399" stop-opacity="0.26"/>
